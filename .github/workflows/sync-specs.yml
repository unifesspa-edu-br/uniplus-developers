name: Sincronizar contratos da API e do Geo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [uniplus-api-openapi-updated]

concurrency:
  group: sync-specs-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar OpenAPI e catálogos de erros
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPOSITORIO_API: unifesspa-edu-br/uniplus-api
      REPOSITORIO_GEO: unifesspa-edu-br/unifesspa-geo-api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Copiar os contratos de um único commit de cada repositório
        id: copiar
        run: |
          set -euo pipefail

          ultimo_commit() {
            local remoto commit
            remoto="$(git ls-remote "https://github.com/$1.git" refs/heads/main)" || return 1
            commit="${remoto%%$'\t'*}"
            [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { printf '%s: commit de main inválido.\n' "$1" >&2; return 1; }
            printf '%s' "$commit"
          }

          baixar() {
            curl --fail --silent --show-error --location --retry 3 "$1" -o "$2"
          }

          copiar_erros() {
            local repositorio="$1" commit="$2" pasta="$3" arquivo
            mkdir -p "$pasta"
            for arquivo in codigos-de-erro.json descricoes-de-erros.json; do
              baixar "https://raw.githubusercontent.com/$repositorio/$commit/contracts/$arquivo" "$pasta/$arquivo"
            done
          }

          gravar_origem() {
            printf '{\n  "repositorio": "%s",\n  "commit": "%s"\n}\n' "$1" "$2" > "$3/origem.json"
          }

          mudou() {
            [[ -n "$(git status --porcelain -- "$@")" ]]
          }

          commit_api="$(ultimo_commit "$REPOSITORIO_API")" || exit 1
          commit_geo="$(ultimo_commit "$REPOSITORIO_GEO")" || exit 1
          pasta_api=src/data/erros/uniplus-api
          pasta_geo=src/data/erros/unifesspa-geo-api
          resumo=''
          alvo=()

          mkdir -p static/openapi
          for modulo in autorizacao configuracao ingresso organizacao portal publicacoes selecao; do
            baixar "https://raw.githubusercontent.com/$REPOSITORIO_API/$commit_api/contracts/openapi.$modulo.json" \
              "static/openapi/$modulo.json"
            if ! python3 -m json.tool "static/openapi/$modulo.json" >/dev/null 2>&1; then
              printf 'static/openapi/%s.json: JSON inválido.\n' "$modulo" >&2
              exit 1
            fi
          done
          copiar_erros "$REPOSITORIO_API" "$commit_api" "$pasta_api"
          if mudou static/openapi "$pasta_api"; then
            gravar_origem "$REPOSITORIO_API" "$commit_api" "$pasta_api"
            resumo+="Contratos copiados de \`$REPOSITORIO_API@$commit_api\`."$'\n'
            alvo+=('da API')
          fi

          copiar_erros "$REPOSITORIO_GEO" "$commit_geo" "$pasta_geo"
          if mudou "$pasta_geo"; then
            gravar_origem "$REPOSITORIO_GEO" "$commit_geo" "$pasta_geo"
            resumo+="Contratos copiados de \`$REPOSITORIO_GEO@$commit_geo\`."$'\n'
            alvo+=('do Geo')
          fi

          if mudou static/openapi; then
            resumo+='Revise o diff do OpenAPI para identificar alterações que precisam entrar no changelog.'$'\n'
          fi

          if [[ -z "$resumo" ]]; then
            printf 'alteracao=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf 'alteracao=true\n'
            printf 'alvo=%s\n' "${alvo[0]}${alvo[1]:+ e ${alvo[1]}}"
            printf 'resumo<<FIM_DO_RESUMO\n%sFIM_DO_RESUMO\n' "$resumo"
          } >> "$GITHUB_OUTPUT"

      - name: Preparar Node.js
        if: steps.copiar.outputs.alteracao == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validar os contratos, requisitos e rotas do catálogo
        if: steps.copiar.outputs.alteracao == 'true'
        run: |
          npm ci
          npm run build

      - name: Obter token do aplicativo de sincronização
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UNIPLUS_SYNC_APP_ID }}
          private-key: ${{ secrets.UNIPLUS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Abrir PR dos contratos validados
        if: steps.copiar.outputs.alteracao == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          commit-message: 'chore(contratos): sincroniza contratos ${{ steps.copiar.outputs.alvo }}'
          title: 'chore(contratos): sincroniza contratos ${{ steps.copiar.outputs.alvo }}'
          body: |
            ${{ steps.copiar.outputs.resumo }}
            O build conferiu os pares de códigos e descrições, os requisitos e os links internos.
          branch: chore/sync-api-contracts
          delete-branch: true
          labels: documentation
          add-paths: |
            static/openapi/
            src/data/erros/

      - name: Encerrar sincronização sem diferenças
        if: steps.copiar.outputs.alteracao == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --state open --base main --head chore/sync-api-contracts \
            --json number,isCrossRepository,headRepositoryOwner,headRefName \
            --jq "[.[] | select(.isCrossRepository == false and .headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\" and .headRefName == \"chore/sync-api-contracts\")][0].number // empty")"
          if [[ -n "$pr" ]]; then
            gh pr close "$pr" --delete-branch
          fi
