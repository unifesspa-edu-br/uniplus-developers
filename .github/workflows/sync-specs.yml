name: Sincronizar contratos da API

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [uniplus-api-openapi-updated]

concurrency:
  group: sync-specs-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar OpenAPI e catálogo de erros
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPOSITORIO_API: unifesspa-edu-br/uniplus-api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Copiar os contratos de um único commit
        id: copiar
        run: |
          set -euo pipefail
          commit="$(git ls-remote "https://github.com/$REPOSITORIO_API.git" refs/heads/main | cut -f1)"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          origem="https://raw.githubusercontent.com/$REPOSITORIO_API/$commit/contracts"
          mkdir -p static/openapi src/data/erros
          for modulo in autorizacao configuracao ingresso organizacao portal publicacoes selecao; do
            curl --fail --silent --show-error --location --retry 3 \
              "$origem/openapi.$modulo.json" -o "static/openapi/$modulo.json"
            if ! python3 -m json.tool "static/openapi/$modulo.json" >/dev/null 2>&1; then
              printf 'static/openapi/%s.json: JSON inválido.\n' "$modulo" >&2
              exit 1
            fi
          done
          for arquivo in codigos-de-erro.json descricoes-de-erros.json; do
            curl --fail --silent --show-error --location --retry 3 \
              "$origem/$arquivo" -o "src/data/erros/$arquivo"
          done
          if [[ -z "$(git status --porcelain -- static/openapi src/data/erros)" ]]; then
            printf 'alteracao=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '{\n  "repositorio": "%s",\n  "commit": "%s"\n}\n' "$REPOSITORIO_API" "$commit" > src/data/erros/origem.json
          printf 'alteracao=true\ncommit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Preparar Node.js
        if: steps.copiar.outputs.alteracao == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validar os contratos, requisitos e rotas do catálogo
        if: steps.copiar.outputs.alteracao == 'true'
        run: |
          npm ci
          npm run build

      - name: Obter token do aplicativo de sincronização
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UNIPLUS_SYNC_APP_ID }}
          private-key: ${{ secrets.UNIPLUS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Abrir PR dos contratos validados
        if: steps.copiar.outputs.alteracao == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          commit-message: 'chore(contratos): sincroniza contratos da API'
          title: 'chore(contratos): sincroniza contratos da API'
          body: |
            Contratos copiados de `unifesspa-edu-br/uniplus-api@${{ steps.copiar.outputs.commit }}`.

            O build conferiu os pares de códigos e descrições, os requisitos e os links internos. Revise o diff do OpenAPI para identificar alterações que precisam entrar no changelog.
          branch: chore/sync-api-contracts
          delete-branch: true
          labels: documentation
          add-paths: |
            static/openapi/
            src/data/erros/

      - name: Encerrar sincronização sem diferenças
        if: steps.copiar.outputs.alteracao == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --state open --base main --head chore/sync-api-contracts \
            --json number,isCrossRepository,headRepositoryOwner,headRefName \
            --jq "[.[] | select(.isCrossRepository == false and .headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\" and .headRefName == \"chore/sync-api-contracts\")][0].number // empty")"
          if [[ -n "$pr" ]]; then
            gh pr close "$pr" --delete-branch
          fi
