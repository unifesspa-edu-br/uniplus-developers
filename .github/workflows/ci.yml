name: Uniplus Developers CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-lint:
    name: ADR lint (MADR 4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar ADRs (MADR 4.0)
        run: bash tools/adr-lint/validate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Markdown lint (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 'docs/adrs/**/*.md'

  component-tests:
    name: Typecheck + testes de componente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de componente (Vitest)
        run: npm run test

  catalogo-erros:
    name: Contrato do catálogo de erros
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar páginas publicadas e a navegação do catálogo (docs/erros)
        run: node tools/catalogo-erros/validar.mjs

      - name: Prova do gate — fixture válida passa (inclui comentário inline)
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida.mdx

      - name: Prova do gate — requisito inexistente reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-requisito-inexistente.mdx; then
            echo "ERRO: o validador aceitou UNI-REQ-9999 — a checagem de existência está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — alias proibido reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-proibido.mdx; then
            echo "ERRO: o validador aceitou alias RNxx na prosa — a checagem de alias está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — alias com ênfase Markdown reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-formatado.mdx; then
            echo "ERRO: o validador aceitou alias RNxx com _ênfase_ colada — a checagem de fronteira está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — alias com marcação no meio do token reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-dividido.mdx; then
            echo "ERRO: o validador aceitou RN**13** — a normalização de ênfase está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — alias dividido por link reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-em-link.mdx; then
            echo "ERRO: o validador aceitou RN[13](/regra) — não está lendo o texto renderizado" >&2
            exit 1
          fi

      - name: Prova do gate — sublinhado literal não vira falso positivo
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-sublinhado-literal.mdx

      - name: Prova do gate — fim de bloco não cola no início do próximo
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-fronteira-de-bloco.mdx

      - name: Prova do gate — quebra de linha forçada não cola fragmentos
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-quebra-de-linha-forcada.mdx

      - name: Prova do gate — sintaxe MDX não renderizada não conta como prosa
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-mdx-nao-renderizado.mdx

      - name: Prova do gate — expressão MDX inline não conta como prosa
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-expressao-mdx-inline.mdx

      - name: Prova do gate — alt de imagem reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-em-alt-de-imagem.mdx; then
            echo "ERRO: o validador ignorou alias no texto alternativo de imagem" >&2
            exit 1
          fi

      - name: Prova do gate — alt de imagem por referência reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-alias-em-alt-de-imagem-por-referencia.mdx; then
            echo "ERRO: o validador ignorou alias no alt de imagem por referência" >&2
            exit 1
          fi

      - name: Prova do gate — item após linha em branco reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-requisito-apos-linha-em-branco.mdx; then
            echo "ERRO: o validador ignorou item após linha em branco na lista — a checagem de existência está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — item após comentário reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-requisito-apos-comentario.mdx; then
            echo "ERRO: o validador ignorou item após comentário na lista — a checagem de existência está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — item nulo reprova, sem esconder o item seguinte
        run: |
          saida="$(node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-item-nulo.mdx || true)"
          echo "$saida"
          if ! grep -q "item de lista malformado" <<< "$saida"; then
            echo "ERRO: o item nulo não foi reportado — o gate está quebrado" >&2
            exit 1
          fi
          if ! grep -q "UNI-REQ-9999" <<< "$saida"; then
            echo "ERRO: o item nulo escondeu o UNI-REQ-9999 seguinte — a leitura parou nele" >&2
            exit 1
          fi

      - name: Prova do gate — index.mdx aninhado não ganha a exceção da raiz
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/indice-aninhado; then
            echo "ERRO: o validador ignorou index.mdx fora da raiz do alvo — a exceção está grande demais" >&2
            exit 1
          fi

      - name: Prova do gate — hash dentro de escalar citado não vira comentário
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-requisito-citado-com-hash.mdx; then
            echo "ERRO: o validador tratou # dentro de aspas como comentário — a checagem de sintaxe está quebrada" >&2
            exit 1
          fi

      - name: Prova do gate — indentação de 4 espaços é aceita
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-indentacao-alternativa.mdx

      - name: Prova do gate — página .md também é coletada e validada
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/pagina-md; then
            echo "ERRO: o validador ignorou uma página .md — a varredura só cobria .mdx" >&2
            exit 1
          fi

      - name: Prova do gate — code fora da taxonomia reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-code-fora-da-taxonomia.mdx; then
            echo "ERRO: o validador aceitou code fora da taxonomia de identificador de causa" >&2
            exit 1
          fi

      - name: Prova do gate — situação desconhecida reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-situacao-desconhecida.mdx; then
            echo "ERRO: o validador aceitou situacao que o cabeçalho da entrada não renderiza" >&2
            exit 1
          fi

      - name: Prova do gate — rascunho que não se anuncia reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-rascunho-sem-anuncio.mdx; then
            echo "ERRO: o validador aceitou rascunho sem anúncio no description — o card do índice não avisaria" >&2
            exit 1
          fi

      - name: Prova do gate — entrada publicada anunciando rascunho reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-publicado-anunciando-rascunho.mdx; then
            echo "ERRO: o validador aceitou anúncio de rascunho em entrada publicada — a correspondência só vale num sentido" >&2
            exit 1
          fi

      - name: Prova do gate — entrada publicada conforme passa
        run: node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/valida-publicada.mdx

      - name: Prova do gate — seção obrigatória ausente reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-sem-secao-obrigatoria.mdx; then
            echo "ERRO: o validador aceitou entrada sem '## Como resolver'" >&2
            exit 1
          fi

      - name: Prova do gate — H1 na prosa reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-h1-na-prosa.mdx; then
            echo "ERRO: o validador aceitou um segundo H1 concorrendo com o título do frontmatter" >&2
            exit 1
          fi

      - name: Prova do gate — título suprimido pelo frontmatter reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-titulo-oculto.mdx; then
            echo "ERRO: o validador aceitou hide_title — a entrada renderizaria sem H1 nenhum" >&2
            exit 1
          fi

      - name: Prova do gate — entrada sem título reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-sem-titulo.mdx; then
            echo "ERRO: o validador aceitou entrada sem title — é o H1 da página" >&2
            exit 1
          fi

      - name: Prova do gate — entrada sem o cabeçalho de identidade reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-sem-cabecalho.mdx; then
            echo "ERRO: o validador aceitou entrada sem <ErrorCatalogEntry> — publicaria prosa sem code, type nem situação" >&2
            exit 1
          fi

      - name: Prova do gate — cabeçalho com props avulsas reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-cabecalho-sem-frontmatter.mdx; then
            echo "ERRO: o validador aceitou <ErrorCatalogEntry> sem {...frontMatter} — o cabeçalho publicado divergiria do frontmatter" >&2
            exit 1
          fi

      - name: Prova do gate — prop sobrepondo o frontmatter no cabeçalho reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-cabecalho-com-prop-sobreposta.mdx; then
            echo "ERRO: o validador aceitou prop depois de {...frontMatter} — o cabeçalho publicado contradiria a rota da página" >&2
            exit 1
          fi

      - name: Prova do gate — hide_title com valor citado reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-titulo-oculto-citado.mdx; then
            echo "ERRO: o validador comparou hide_title com o booleano literal — o Docusaurus coage o valor citado e a página fica sem H1" >&2
            exit 1
          fi

      - name: Prova do gate — cabeçalho importado de outro módulo reprova
        run: |
          if node tools/catalogo-erros/validar.mjs tools/catalogo-erros/fixtures/invalida-cabecalho-de-outro-modulo.mdx; then
            echo "ERRO: o validador reconheceu só o nome da tag — o identificador pode vir de qualquer componente" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — navegação conforme passa
        run: |
          node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-conforme.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas

      - name: Prova do gate (catálogo) — página fora da navegação reprova
        run: |
          if node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-sem-a-segunda.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas; then
            echo "ERRO: o validador aceitou página publicada e ausente da navegação — ela não apareceria no índice" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — item de navegação sem página reprova
        run: |
          if node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-com-item-orfao.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas; then
            echo "ERRO: o validador aceitou item de navegação sem página correspondente" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — code divergente do nome do arquivo reprova
        run: |
          if node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-divergente.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas-code-divergente; then
            echo "ERRO: o validador aceitou code divergente do nome do arquivo — o campo type publicado apontaria para outro lugar" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — item repetido na navegação reprova
        run: |
          if node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-com-item-repetido.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas; then
            echo "ERRO: o validador aceitou item repetido na navegação — o índice publicaria card duplicado" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — categoria ausente na navegação falha alto
        run: |
          saida="$(node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-sem-categoria.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas 2>&1 || true)"
          echo "$saida"
          if ! grep -q "não encontrada" <<< "$saida"; then
            echo "ERRO: navegação sem a categoria do catálogo não falhou alto — o gate passaria a comparar contra lista vazia" >&2
            exit 1
          fi

      - name: Prova do gate (catálogo) — categoria vazia na navegação falha alto
        run: |
          saida="$(node tools/catalogo-erros/validar.mjs \
            --sidebar=tools/catalogo-erros/fixtures/catalogo/sidebars-vazia.ts \
            tools/catalogo-erros/fixtures/catalogo/paginas 2>&1 || true)"
          echo "$saida"
          if ! grep -q "sem nenhuma entrada" <<< "$saida"; then
            echo "ERRO: categoria vazia não falhou alto — catálogo vazio passaria por comparação vacuosa" >&2
            exit 1
          fi
